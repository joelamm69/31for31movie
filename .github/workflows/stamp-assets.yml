name: Stamp asset versions

# Adds ?v=<fingerprint> to every local CSS/JS link in the site's HTML, so
# after a deploy browsers and Hostinger's CDN fetch the new files instead of
# serving stale cached copies. See scripts/stamp_assets.py.
on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "**.html"
      - "scripts/stamp_assets.py"
      - ".github/workflows/stamp-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stamp-assets
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/stamp_assets.py
      - name: Commit stamped pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "Asset links already up to date."
          else
            git commit -m "Stamp asset versions"
            git push
          fi
