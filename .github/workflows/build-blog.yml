name: Build blog

# Turns the Markdown files in blog/_posts/ into the blog's HTML pages and
# commits them, so Hostinger's auto-deploy picks up the finished pages.
on:
  push:
    branches: [main]
    paths:
      - "blog/_posts/**"
      - "scripts/build_blog.py"
      - ".github/workflows/build-blog.yml"
      - "scripts/stamp_assets.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7
      - run: python3 scripts/build_blog.py
      - name: Commit built pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add blog/index.html blog/posts
          if git diff --cached --quiet; then
            echo "Blog already up to date."
          else
            git commit -m "Build blog pages"
            git push
          fi
